name: Bug report
description: Something does not install, run or reproduce
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command, notebook cell or code you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `fmflow doctor`
      description: Run `fmflow doctor` (or `python -m fmflow doctor`) in the same environment and paste the output.
      render: text
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install?
      options: [setup.sh / setup.ps1 / setup.cmd, uv sync, pip install -e, Docker, Google Colab, Binder, GitHub Codespaces, other]
    validations:
      required: true
